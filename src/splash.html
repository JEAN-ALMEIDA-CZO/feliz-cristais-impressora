<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>Feliz Cristais Gestão</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
  .card{position:absolute;inset:14px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#f6efe4;overflow:hidden;
    background:radial-gradient(90% 70% at 50% 0%,rgba(201,164,92,.35),transparent 65%),linear-gradient(165deg,#241a13,#30231a 55%,#3d2c1c);
    box-shadow:0 24px 60px -18px rgba(0,0,0,.65),inset 0 0 0 1px rgba(201,164,92,.28);animation:in .5s cubic-bezier(.2,.8,.2,1) both}
  body.out .card{animation:out .35s ease both}
  @keyframes in{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:scale(1.03)}}
  /* brilhos de fundo */
  .glow{position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(40px);opacity:.35;animation:drift 6s ease-in-out infinite alternate}
  .glow.a{background:#c9a45c;top:-120px;left:-60px}.glow.b{background:#9b6bd6;bottom:-140px;right:-80px;animation-delay:-3s;opacity:.22}
  @keyframes drift{to{transform:translate(30px,20px) scale(1.1)}}
  /* logo com anel dourado */
  .logo{position:relative;width:118px;height:118px;margin-bottom:14px}
  .ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#f3dcaa 75%,#c9a45c 88%,transparent 100%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 1.4s linear infinite}
  .ring.b{inset:-14px;opacity:.35;animation-duration:2.6s;animation-direction:reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo img{position:relative;width:118px;height:118px;border-radius:50%;box-shadow:0 0 0 2px rgba(201,164,92,.55),0 14px 30px -10px rgba(0,0,0,.7);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.04);box-shadow:0 0 0 2px rgba(201,164,92,.8),0 0 30px rgba(201,164,92,.45)}}
  .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#f3dcaa;box-shadow:0 0 10px #f3dcaa;opacity:0;animation:spark 2.4s ease-in-out infinite}
  .spark:nth-child(4){top:6px;right:4px}.spark:nth-child(5){bottom:10px;left:-2px;animation-delay:.8s}.spark:nth-child(6){top:44%;right:-12px;animation-delay:1.6s}
  @keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
  h1{margin:6px 0 0;font-size:21px;letter-spacing:-.01em;animation:fade .6s .15s both}
  h1 b{color:#e7c27c;font-weight:700}
  .msg{color:rgba(246,239,228,.68);font-size:13px;min-height:18px;animation:fade .6s .3s both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bar{width:180px;height:3px;margin-top:14px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,transparent,#e7c27c,transparent);animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
  .ver{position:absolute;bottom:12px;font-size:11px;color:rgba(246,239,228,.45);letter-spacing:.04em}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="card">
  <span class="glow a"></span><span class="glow b"></span>
  <div class="logo"><span class="ring"></span><span class="ring b"></span><img src="assets/icon.png" alt=""><i class="spark"></i><i class="spark"></i><i class="spark"></i></div>
  <h1>Feliz Cristais <b>Gestão</b></h1>
  <div class="msg" id="msg">Iniciando…</div>
  <div class="bar"><i></i></div>
  <div class="ver" id="ver"></div>
</div>
<script src="splash.js"></script>
</body>
</html>
