<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Sem conexão · Feliz Cristais Gestão</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#2a2018;text-align:center;
    background:radial-gradient(70% 50% at 50% 0%,rgba(201,164,92,.25),transparent 70%),#FBF8F4}
  img{width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 3px rgba(201,164,92,.5),0 18px 40px -18px rgba(120,80,20,.6);animation:f 3s ease-in-out infinite alternate}
  @keyframes f{to{transform:translateY(-6px)}}
  h1{font-size:21px;margin:18px 0 6px}
  p{margin:0;color:#7a6a58;max-width:340px}
  .dots{margin-top:18px;display:flex;gap:6px;justify-content:center}
  .dots i{width:8px;height:8px;border-radius:50%;background:#c9a45c;animation:d 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes d{50%{opacity:.25;transform:scale(.7)}}
</style>
</head>
<body>
<main>
  <img src="assets/icon.png" alt="">
  <h1>Sem conexão com a loja</h1>
  <p>Assim que a internet voltar, o painel abre sozinho. Os avisos e a impressão continuam tentando em segundo plano.</p>
  <div class="dots"><i></i><i></i><i></i></div>
</main>
</body>
</html>
