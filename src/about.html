<title>Feliz Cristais Gestão · Suporte</title>
<style>
  :root{--gold:#c9a45c;--gold2:#b8862f;--ink:#f6efe4;--muted:rgba(246,239,228,.64);--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(90% 55% at 50% 0%,rgba(201,164,92,.32),transparent 65%),linear-gradient(170deg,#211812,#2e2117 60%,#3a2a1b);padding:30px 26px 22px}
  .logo{width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 3px rgba(201,164,92,.55),0 18px 40px -16px rgba(0,0,0,.7);animation:float 4s ease-in-out infinite alternate}
  @keyframes float{to{transform:translateY(-5px)}}
  h1{margin:16px 0 2px;font-size:21px;letter-spacing:-.01em}
  .ver{display:inline-block;margin-top:4px;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:#f3dcaa;background:rgba(201,164,92,.18);box-shadow:inset 0 0 0 1px rgba(201,164,92,.45)}
  .dev{margin:22px 0 4px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .dev b{display:block;margin-top:4px;font-size:18px;letter-spacing:0;text-transform:none;color:var(--ink)}
  .links{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .links button{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-radius:14px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;
    background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s,background .2s,box-shadow .2s;text-align:left}
  .links button:hover{transform:translateY(-2px);background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(201,164,92,.5)}
  .links button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
  .links svg{width:22px;height:22px;flex-shrink:0}
  .links .wa{grid-column:1/-1;justify-content:center;background:linear-gradient(135deg,#25d366,#128c4a);box-shadow:0 12px 26px -14px rgba(37,211,102,.9)}
  .links .wa small{color:rgba(255,255,255,.85)}
  .links .wa:hover{background:linear-gradient(135deg,#2ee673,#15a157)}
  footer{margin-top:auto;padding-top:18px;color:var(--muted);font-size:12px}
  footer a{color:var(--gold);cursor:pointer;text-decoration:none}
</style>
</head>
