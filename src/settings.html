<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>Feliz Cristais Impressora</title>
<style>
  :root{--gold:#c9a45c;--gold2:#b8862f;--ink:#f6efe4;--muted:rgba(246,239,228,.62);--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(80% 60% at 100% 0%,rgba(201,164,92,.28),transparent 60%),linear-gradient(160deg,#211812,#2e2117 60%,#3a2a1b);min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:22px 24px 14px}
  header img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px rgba(201,164,92,.6)}
  header h1{margin:0;font-size:18px}
  header small{color:var(--muted)}
  .status{margin:0 24px 14px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  .dot{width:11px;height:11px;border-radius:50%;background:#8e8e93;flex-shrink:0}
  .status.on .dot{background:#34c759;box-shadow:0 0 0 5px rgba(52,199,89,.2)}
  .status b{display:block}
  .status span{color:var(--muted);font-size:12.5px}
  form{margin:0 24px;display:flex;flex-direction:column;gap:12px}
  label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
  input,select{width:100%;border:0;border-radius:11px;padding:11px 12px;font:inherit;font-size:14px;color:#2a2018;background:#fbf7f1;outline:none}
  input:focus,select:focus{box-shadow:0 0 0 3px rgba(201,164,92,.5)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .switch{flex-direction:row;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:11px;background:var(--card);color:var(--ink);font-weight:500}
  .switch input{width:auto;accent-color:var(--gold);transform:scale(1.25)}
  .help{font-weight:400;font-size:12px;color:var(--muted)}
  .actions{display:flex;gap:8px;margin-top:4px}
  button{border:0;border-radius:999px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold2))}
  button.alt{background:rgba(255,255,255,.1);color:var(--ink)}
  button:disabled{opacity:.6}
  .printer{display:flex;gap:8px}
  .printer button{flex-shrink:0;padding:0 14px}
  h2{margin:18px 24px 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .log{margin:0 24px 16px;max-height:150px;overflow:auto;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.22);font:12px/1.6 ui-monospace,Menlo,Consolas,monospace}
  .log div{color:var(--muted)}
  .log .ok{color:#7ee2a0}.log .error{color:#ffb4a8}
  footer{display:flex;justify-content:space-between;align-items:center;margin:0 24px 18px;color:var(--muted);font-size:12px}
  footer a{color:var(--gold);cursor:pointer}
</style>
</head>
<body>
<header>
  <img src="assets/icon.png" alt="">
  <div><h1>Feliz Cristais Impressora</h1><small>Imprime os pedidos da loja sozinha, em segundo plano.</small></div>
</header>
<div class="status" id="status"><span class="dot"></span><div><b id="st-title">Desconectada</b><span id="st-msg">…</span></div></div>
<form id="f">
  <label>Endereço do site<input name="site" placeholder="https://www.felizcristais.com.br" required spellcheck="false"></label>
  <label>Chave de impressão<input name="key" placeholder="Cole aqui (Painel › Impressão de pedidos › Aplicativo)" required spellcheck="false">
    <span class="help">A chave fica no painel da loja, em Impressão de pedidos. Ela autoriza só a impressão.</span></label>
  <label>Impressora
    <span class="printer"><select name="printer" id="printer"><option value="">Impressora padrão do sistema</option></select><button type="button" class="alt" id="refresh" title="Atualizar lista">↻</button></span></label>
  <div class="row">
    <label>Vias<select name="copies"><option value="1">1 via</option><option value="2">2 vias</option><option value="3">3 vias</option></select></label>
    <label>Consultar a cada<select name="every"><option value="3">3 segundos</option><option value="5">5 segundos</option><option value="10">10 segundos</option><option value="30">30 segundos</option></select></label>
  </div>
  <label class="switch">Iniciar junto com o computador<input type="checkbox" name="autostart"></label>
  <label class="switch">Aviso na tela ao imprimir<input type="checkbox" name="notify"></label>
  <div class="actions">
    <button type="submit" id="save">Salvar e conectar</button>
    <button type="button" class="alt" id="test">Imprimir teste</button>
  </div>
</form>
<h2>Atividade</h2>
<div class="log" id="log"><div>Nada por aqui ainda.</div></div>
<footer><span id="ver"></span><a id="upd">Procurar atualizações</a></footer>
<script src="settings.js"></script>
</body>
</html>
