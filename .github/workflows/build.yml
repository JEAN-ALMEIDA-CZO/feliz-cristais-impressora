# Compila o aplicativo para Windows e Mac e publica a versão nas Releases do GitHub.
# Para lançar uma versão nova: mude "version" no package.json, faça commit e crie a tag (ex.: v1.0.1).
# O aplicativo instalado nas lojas encontra a versão nova sozinho e se atualiza.
name: Compilar e publicar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compilar e publicar
        # O Mac às vezes falha ao criar o .dmg (disco ocupado): tenta de novo antes de desistir
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish always || (sleep 30 && npx electron-builder ${{ matrix.target }} --publish always)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem certificado da Apple/Microsoft por enquanto (veja o README)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # Changelog na página da versão (o app mostra na tela de atualização)
  changelog:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o changelog na versão
        run: gh release edit "${{ github.ref_name }}" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
